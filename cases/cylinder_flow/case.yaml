name: "Cylinder Flow"
case_type: "parametric_2d"
description: "Flow around cylinder - analytical validation case (Cp = 1 - 4*sin^2(theta))"

freestream:
  velocity: [1.0, 0.0, 0.0]

components:
  - name: "cylinder"
    geometry:
      type: "circle"
      parameters:
        radius: 0.5
        center: [0.0, 0.0]
    mesh_levels:
      - [16] # Level 0: 16 panels (coarse)
      - [32] # Level 1: 32 panels
      - [64] # Level 2: 64 panels
      - [128] # Level 3: 128 panels
      - [256] # Level 4: 256 panels (fine)
    transform:
      translation: [0.0, 0.0, 0.0]
      rotation_deg: 0.0
    boundary_condition:
      type: "wall"
      heat_flux: 1000.0 # W/m² uniform surface heat flux

solver:
  type: "constant_source"
  tolerance: 1.0e-10

visualization:
  domain:
    x_range: [-2.0, 3.0]
    y_range: [-2.0, 2.0]
  resolution: [200, 160]

fluid:
  density: 1.225
  viscosity: 1.789e-5 # Optional
  gravity: 0.0 # Optional
  reference_pressure: 101325.0
  reference_type: freestream
  freestream_temperature: 300.0 # K
  thermal_conductivity: 0.026 # W/mK (air)
  specific_heat_cp: 1005.0 # J/kgK (air)

boundary_layer:
  enabled: true
  profiles:
    - blasius
    - thwaites
    - falkner_skan
    - pohlhausen
  transition_model: "michel"
  envelope_scale: 0.15

thermal:
  enabled: true
  solver: "reynolds_analogy" # Options: reynolds_analogy
  envelope_scale: 0.15
