name: "My Body 3D"
case_type: "external_3d"

freestream:
  velocity: [1.0, 0.0, 0.0]

components:
  - name: "body"
    geometry:
      type: "external"
      file: "shapes/body.unv"
    transform:
      translation: [0.0, 0.0, 0.0]
      rotation_xyz_deg: [0.0, 0.0, 0.0]
    boundary_condition:
      type: "wall"

solver:
  singularity_type: "source"
  panel_order: "constant"
  panel_geometry: "flat"

visualization:
  domain:
    x_range: [-2.0, 2.0]
    y_range: [-2.0, 2.0]
    z_range: [-2.0, 2.0]
  resolution: [100, 100, 100]

fluid:
  density: 1.225
