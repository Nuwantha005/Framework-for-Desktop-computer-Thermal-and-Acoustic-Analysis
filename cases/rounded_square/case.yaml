name: "Single Square"
case_type: "parametric_2d"
description: "Unit square in uniform freestream - basic validation case"

freestream:
  velocity: [1.0, 0.0, 0.0]

components:
  - name: "square"
    geometry:
      type: "rounded_rectangle"
      parameters:
        width: 1.0
        height: 1.0
        corner_radius: 0.09
        center: [0.0, 0.0]
    mesh_levels:
      - [2, 2] # Level 0: 8 panels (coarse)
      - [4, 4] # Level 1: 16 panels
      - [8, 8] # Level 2: 32 panels
      - [16, 16] # Level 3: 64 panels
      - [32, 32] # Level 4: 128 panels (fine)
      - [64, 64] # Level 5: extreamly fine
    transform:
      translation: [0.0, 0.0, 0.0]
      rotation_deg: 0.0
    boundary_condition:
      type: "wall"

solver:
  type: "linear_source"
  tolerance: 1.0e-10

fluid:
  density: 1.225
  viscosity: 1.81e-5 # air at STP [Pa·s]

boundary_layer:
  enabled: true
  profiles:
    - blasius
    - thwaites
    - falkner_skan
    - pohlhausen
  transition_model: "michel"
  envelope_scale: 0.15

visualization:
  domain:
    x_range: [-2.0, 2.0]
    y_range: [-1.5, 1.5]
  resolution: [150, 120]
