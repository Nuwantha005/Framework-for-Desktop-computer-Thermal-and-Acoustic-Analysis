site_name: Panel Method Solver
site_description: 2D/3D Panel Method Solver with OpenFOAM Validation Pipeline
site_url: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - navigation.top
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

nav:
  - Home: index.md
  - Architecture: architecture.md
  - User Guide:
      - Getting Started: user_guide/getting_started.md
      - Case Files: user_guide/case_files.md
      - Running Validation: user_guide/validation.md
  - Theory:
      - Overview: theory/panel_methods_overview.md
      - Constant Source Panels: theory/constant_source_panels.md
      - Linear Source Panels: theory/linear_source_panels.md
      - Boundary Layers: theory/boundary_layers.md
  - Modules:
      - Geometry: modules/geometry.md
      - Solver: modules/solver.md
      - I/O: modules/io.md
      - Visualization: modules/visualization.md
      - Validation: modules/validation.md
  - API Reference: api/index.md
  - Development:
      - Roadmap: dev/roadmap.md
      - Decisions: dev/decisions.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_if_no_docstring: false
            merge_init_into_class: true
            show_signature_annotations: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
